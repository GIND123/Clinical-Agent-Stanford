# Action vocabulary for TEST(x) and ASK(q), with per-action cost (US$).
#
# Panels and itemids follow Hager et al.'s ADDITIONAL_LAB_TEST_MAPPING
# (MIMIC-Clinical-Decision-Making-Framework, tools/utils.py); LA-CDM (ICLR 2026) exposes
# the same panels. A lab matches a test if its MIMIC itemid is listed, or (for data
# without itemids, e.g. synthetic cases) if its label is in `names` with matching fluid.
#
# Costs:
#   cost_source: bidmc  -> 2025 BIDMC standard charges (CMS price transparency), as
#                          published in LA-CDM Table 4. BIDMC is where MIMIC was collected.
#   cost_source: placeholder -> NOT sourced; chargemaster-scale guesses. Replace before
#                          quoting any cost number.
# reward.cost_scale: auto normalises by the catalog total (LA-CDM's convention: ordering
# every test costs exactly one correct diagnosis).

ask:
  physical_exam:           {cost: 0.0,  display: "Physical examination"}
  past_medical_history:    {cost: 0.0,  display: "Past medical history"}
  past_surgical_history:   {cost: 0.0,  display: "Past surgical history"}
  medications:             {cost: 0.0,  display: "Current medications"}
  allergies:               {cost: 0.0,  display: "Allergies"}
  family_history:          {cost: 0.0,  display: "Family history"}
  social_history:          {cost: 0.0,  display: "Social history"}

tests:
  # ---- panels (LA-CDM action set) ------------------------------------------------
  cbc:
    kind: lab
    cost: 71
    cost_source: bidmc
    display: "Complete blood count"
    itemids: [51279, 51301, 51755, 51300, 51222, 50811, 51221, 51638, 50810, 51250, 51248, 51249, 51265,
              51244, 51133, 52769, 51245, 51146, 52069, 51200, 52073, 51254, 52074, 51253, 51256, 52075,
              51277, 52172]
    names: ["White Blood Cells", "Hemoglobin", "Hematocrit", "Platelet Count", "Red Blood Cells",
            "MCV", "MCH", "MCHC", "RDW", "Neutrophils", "Lymphocytes", "Monocytes", "Eosinophils", "Basophils"]
    fluid: Blood
  bmp:
    kind: lab
    cost: 298
    cost_source: bidmc
    display: "Basic metabolic panel"
    itemids: [50809, 50931, 52569, 50824, 50983, 52623, 50822, 50971, 52610, 50806, 50902, 52535,
              50803, 50882, 51006, 52647, 50912, 52024, 52546, 50808, 50893, 51624]
