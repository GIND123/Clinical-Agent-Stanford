            "Glucose", "Calcium, Total"]
    fluid: Blood
  cmp:
    kind: lab
    cost: 636
    cost_source: bidmc
    display: "Comprehensive metabolic panel"
    itemids: [50809, 50931, 52569, 50824, 50983, 52623, 50822, 50971, 52610, 50806, 50902, 52535,
              50803, 50882, 51006, 52647, 50912, 52024, 52546, 50808, 50893, 51624,
              50861, 50863, 50878, 50883, 50884, 50885, 50976]
    names: ["Sodium", "Potassium", "Chloride", "Bicarbonate", "Urea Nitrogen", "Creatinine", "Glucose",
            "Calcium, Total", "Alanine Aminotransferase (ALT)", "Alkaline Phosphatase",
            "Asparate Aminotransferase (AST)", "Bilirubin, Total", "Protein, Total"]
    fluid: Blood
  renal_panel:
    kind: lab
    cost: 394
    cost_source: bidmc
    display: "Renal function panel"
    itemids: [50862, 51006, 52647, 50824, 50983, 52623, 50808, 50893, 51624, 50804, 51739, 50806,
              50902, 52535, 50912, 52024, 52546, 50809, 50931, 52569, 50970, 50822, 50971, 52610]
