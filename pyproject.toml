[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deferdx"
version = "0.1.0"
description = "DEFER-Dx: RL-trained clinical diagnostic agents that ASK, TEST, COMMIT, or DEFER to a clinician"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Local model training / inference. No hosted-API clients on purpose (PhysioNet DUA).
train = [
    "torch>=2.2",
    "transformers>=4.51",
    "peft>=0.11",
]
vllm = ["vllm>=0.8"]
# Building MIMIC-CDM-OW directly from MIMIC-IV csv.gz files.
data = ["duckdb>=1.0", "pyarrow>=14", "scikit-learn>=1.3"]
dev = ["pytest>=8"]

[project.scripts]
deferdx = "deferdx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
