name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch, no MIMIC data needed)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[data,dev]" "transformers>=4.51"
      - name: Unit tests
        run: pytest -q
      - name: Synthetic end-to-end smoke test
        run: OUT=/tmp/smoke bash scripts/smoke_synthetic.sh
